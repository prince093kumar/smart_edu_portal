{% if messages %}
<div class="space-y-2 mb-4">
    {% for message in messages %}
    <div class="alert-auto-dismiss flex items-center justify-between p-4 rounded-md border text-sm font-medium shadow-sm transition
        {% if message.tags == 'error' %}
            bg-destructive/10 text-destructive border-destructive/20
        {% elif message.tags == 'success' %}
            bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20
        {% elif message.tags == 'warning' %}
            bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20
        {% else %}
            bg-primary/10 text-primary border-primary/20
        {% endif %}">
        <div class="flex items-center space-x-2">
            {% if message.tags == 'error' %}
            <i data-lucide="alert-circle" class="h-4 w-4"></i>
            {% elif message.tags == 'success' %}
            <i data-lucide="check-circle-2" class="h-4 w-4"></i>
            {% else %}
            <i data-lucide="info" class="h-4 w-4"></i>
            {% endif %}
            <span>{{ message }}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="text-muted-foreground hover:text-foreground">
            <i data-lucide="x" class="h-4 w-4"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}

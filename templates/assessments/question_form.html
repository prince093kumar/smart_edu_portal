{% extends 'base.html' %}

{% block title %}Add Question - {{ quiz.title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="rounded-xl border border-border bg-card p-6 sm:p-8 shadow-sm space-y-6">
        <div>
            <h1 class="text-xl font-bold text-foreground">Add Multiple-Choice Question</h1>
            <p class="text-sm text-muted-foreground">To: {{ quiz.title }} &bull; {{ quiz.course.title }}</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Question Prompt</label>
                <textarea name="text" rows="3" required class="w-full px-3 py-2 text-sm rounded-md border border-border bg-card text-foreground focus:ring-2 focus:ring-primary focus:outline-none" placeholder="Enter question text..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Marks</label>
                <input type="number" name="marks" value="1" min="1" class="w-32 px-3 py-2 text-sm rounded-md border border-border bg-card text-foreground focus:ring-2 focus:ring-primary focus:outline-none">
            </div>

            <div class="pt-4 border-t border-border space-y-3">
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground">Choices (Select the Radio for Correct Answer)</label>
                
                {% for i in "0123" %}
                <div class="flex items-center space-x-3">
                    <input type="radio" name="correct_choice" value="{{ forloop.counter0 }}" {% if forloop.first %}checked{% endif %} class="h-4 w-4 text-primary focus:ring-primary">
                    <input type="text" name="choice_text" placeholder="Option {{ forloop.counter }}" class="flex-grow px-3 py-2 text-sm rounded-md border border-border bg-card text-foreground focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                {% endfor %}
            </div>

            <div class="flex items-center space-x-3 pt-6 border-t border-border">
                <button type="submit" name="save_and_add" value="1" class="px-4 py-2.5 rounded-md bg-accent text-accent-foreground font-semibold text-sm hover:bg-accent/80 transition">
                    Save & Add Another
                </button>
                <button type="submit" class="px-5 py-2.5 rounded-md bg-primary text-primary-foreground font-semibold text-sm hover:bg-primary/90 shadow transition">
                    Done (Save & Return)
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Create Assignment - {{ course.title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="rounded-xl border border-border bg-card p-6 sm:p-8 shadow-sm space-y-6">
        <div>
            <h1 class="text-xl font-bold text-foreground">Post New Assignment</h1>
            <p class="text-sm text-muted-foreground">For: {{ course.title }}</p>
        </div>

        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Assignment Title</label>
                {{ form.title }}
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Due Date & Time</label>
                {{ form.due_date }}
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Maximum Marks</label>
                {{ form.max_marks }}
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Instructions & Problem Statement</label>
                {{ form.description }}
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Attachment File (Optional)</label>
                {{ form.file }}
            </div>

            <div class="flex items-center space-x-3 pt-4 border-t border-border">
                <button type="submit" class="px-5 py-2.5 rounded-md bg-primary text-primary-foreground font-semibold text-sm hover:bg-primary/90 shadow transition">
                    Post Assignment
                </button>
                <a href="{% url 'courses:detail' course.slug %}" class="px-4 py-2.5 rounded-md border border-border text-sm font-semibold hover:bg-muted transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

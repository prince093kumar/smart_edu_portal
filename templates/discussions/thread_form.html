{% extends 'base.html' %}

{% block title %}New Topic - {{ course.title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="rounded-xl border border-border bg-card p-6 sm:p-8 shadow-sm space-y-6">
        <div>
            <h1 class="text-xl font-bold text-foreground">Create Discussion Topic</h1>
            <p class="text-sm text-muted-foreground">Course: {{ course.title }}</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Topic Title</label>
                {{ form.title }}
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1">Content / Question</label>
                {{ form.content }}
            </div>

            <div class="flex items-center space-x-3 pt-4 border-t border-border">
                <button type="submit" class="px-5 py-2.5 rounded-md bg-primary text-primary-foreground font-semibold text-sm hover:bg-primary/90 shadow transition">
                    Post Topic
                </button>
                <a href="{% url 'discussions:list' course.slug %}" class="px-4 py-2.5 rounded-md border border-border text-sm font-semibold hover:bg-muted transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
